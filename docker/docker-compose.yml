# Docker Compose for Hardwood Species Selector Development
services:
  # PostgreSQL Database with custom Dockerfile
  database:
    build:
      context: ..
      dockerfile: docker/Dockerfile.postgres
    container_name: hardwood-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: hardwood_selector
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - hardwood-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hardwood_selector && psql -U postgres -d hardwood_selector -c 'SELECT COUNT(*) FROM wood_species;' > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  # Backend API
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: hardwood-backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3001
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: hardwood_selector
      DB_USER: postgres
      DB_PASSWORD: password
      DB_SSL: false
      CORS_ORIGIN: http://localhost:5173
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX_REQUESTS: 100
    ports:
      - "3001:3001"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - hardwood-network
    volumes:
      - ../backend/src:/app/src:ro,Z
      - ../backend/package.json:/app/package.json:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Development Frontend with Vite dev server
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    container_name: hardwood-frontend-dev
    restart: unless-stopped
    environment:
      # Use the internal Docker network URL for API proxy
      - VITE_API_URL=http://backend:3001
      # Add flag to indicate Docker environment
      - DOCKER_ENV=true
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - hardwood-network
    volumes:
      - ../frontend/src:/app/src:Z
      - ../frontend/public:/app/public:Z
      - ../frontend/package.json:/app/package.json:ro,Z
      - ../frontend/index.html:/app/index.html:ro,Z
      - ../frontend/vite.config.ts:/app/vite.config.ts:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5173/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local

networks:
  hardwood-network:
    driver: bridge